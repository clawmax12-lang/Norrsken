[project]
name = "tribe-worker"
version = "0.1.0"
description = "Preflight GPU worker: runs TRIBE v2 on a rendered video and speaks the SimulationResult contract over HTTP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "preflight",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=2.1",
  "nibabel>=5.1",
  "nilearn>=0.11",
]

[project.optional-dependencies]
# Pulls torch, neuralset, transformers: only installed on the GPU machine (`make install-gpu`).
model = ["tribev2"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.110",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv.sources]
preflight = { path = "../../backend", editable = true }
tribev2 = { path = "../../vendor/tribev2", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tribe_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "RET", "PTH", "PL",
  "TID", "TCH", "ARG", "RUF", "S", "T20", "ASYNC", "PERF", "D", "ANN",
]
ignore = ["D100", "D104", "D203", "D213", "PLR2004", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S", "PLR0913", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src:../../backend/src"
packages = ["tribe_worker"]

[[tool.mypy.overrides]]
# Optional GPU-only dependency (extra "model"); imported lazily inside Tribev2Predictor.
module = [
  "tribev2", "tribev2.*", "nilearn", "nilearn.*", "nibabel", "nibabel.*",
  "torch", "torch.*", "huggingface_hub", "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live' --cov=tribe_worker --cov-report=term-missing:skip-covered"
markers = ["live: needs a GPU, tribev2 weights and Llama access; never run in CI"]
