[project]
name = "preflight"
version = "0.1.0"
description = "Preflight backend: plans, renders and pretests launch videos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "google-genai>=1.0",
  "pillow>=10.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.110",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "RET", "PTH", "PL",
  "TID", "TCH", "ARG", "RUF", "S", "T20", "ASYNC", "PERF", "D", "ANN",
]
ignore = ["D100", "D104", "D203", "D213", "PLR2004", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/preflight/ports.py" = ["D102"]  # protocol methods are documented by their class
"tests/**" = ["D", "ANN", "S", "PLR0913", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["preflight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=preflight --cov-report=term-missing:skip-covered"
markers = ["live: needs real credentials or a GPU; never run in CI"]
